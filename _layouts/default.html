<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: white;
            font-size: 16px;
        }
        .wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem;
        }
        main h1 { font-size: 1.8rem; font-weight: 400; margin: 0 0 0.75rem; }
        .updated {
            font-size: 0.8rem;
            font-weight: 400;
            color: #888;
            text-align: right;
            margin: 0 0 0.35rem;
        }
        .course-header {
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }
        .course-header-info { flex: 1; min-width: 0; }
        .course-header-info p { margin-bottom: 0.85rem; }
        .course-header-info p:last-child { margin-bottom: 0; }
        .course-header-image {
            flex: 0 0 42%;
            max-width: 380px;
        }
        .course-header-image img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 2px;
        }
        main h2 {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.55rem;
            font-size: 1.55rem;
            font-weight: 600;
            margin: 2.75rem 0 0.9rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e6e6e6;
        }
        main h3 { font-size: 1.1rem; font-weight: 500; margin: 1.5rem 0 0.5rem; }
        main p { margin-bottom: 1rem; }
        main ul, main ol { margin: 0 0 1rem 1.4rem; }
        main li { margin-bottom: 0.35rem; }
        main a { color: #0066cc; }
        main strong { font-weight: 600; }
        main em { font-style: italic; }
        main hr { border: none; border-top: 1px solid #e0e0e0; margin: 2rem 0; }
        main table { width: 100%; border-collapse: collapse; margin: 0 0 1.5rem; font-size: 0.88rem; }
        main th, main td { text-align: left; padding: 0.5rem 0.65rem; border-bottom: 1px solid #e6e6e6; vertical-align: middle; }
        main th { font-weight: 600; background: #f5f5f5; border-bottom: 2px solid #ddd; }
        main table.assessment { table-layout: fixed; }
        main table.assessment th:last-child,
        main table.assessment td:last-child {
            width: 7rem;
            text-align: center;
            white-space: nowrap;
        }
        .table-scroll {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            -webkit-overflow-scrolling: touch;
        }
        .table-scroll table { margin-bottom: 0; }
        main table.schedule {
            min-width: 760px;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0;
        }
        main table.schedule th:nth-child(1) { width: 7%; }
        main table.schedule th:nth-child(2) { width: 11%; }
        main table.schedule th:nth-child(3) { width: 12%; }
        main table.schedule th:nth-child(4) { width: 22%; }
        main table.schedule th:nth-child(5) { width: 48%; }
        main table.schedule.no-event th:nth-child(1) { width: 8%; }
        main table.schedule.no-event th:nth-child(2) { width: 14%; }
        main table.schedule.no-event th:nth-child(3) { width: 28%; }
        main table.schedule.no-event th:nth-child(4) { width: 50%; }
        main table.schedule th,
        main table.schedule td { overflow-wrap: break-word; }
        main table.schedule tbody + tbody tr:first-child td { border-top: 3px solid #b8bec6; }
        main table.schedule tbody.block-b { background: #f3f5f7; }
        main table.schedule tbody.due { background: #fff6e5; }
        main table.schedule tbody.due tr:first-child td { border-top: 2px solid #e6d3a5; }
        main table.schedule tr.presentation td {
            background: #dce8f8;
            border-top: 1px solid #c5d4e8;
        }
        main table.schedule tr.presentation td.topic { font-weight: 600; }
        main table.schedule td.week {
            white-space: nowrap;
            font-weight: 600;
            color: #444;
            text-align: center;
            width: 3.2em;
        }
        main table.schedule td.date {
            white-space: nowrap;
        }
        main table.schedule:not(.no-event) th:nth-child(3),
        main table.schedule.no-event th:nth-child(2) {
            white-space: nowrap;
        }
        main table.schedule ul.readings {
            margin: 0;
            padding-left: 1.15em;
        }
        main table.schedule ul.readings li {
            margin: 0 0 0.25rem;
        }
        main table.schedule ul.readings li:last-child { margin-bottom: 0; }
        @media (max-width: 768px) {
            .wrap { padding: 1rem 1rem 3rem; }
            main h1 { font-size: 1.5rem; }
            .course-header { flex-direction: column; }
            .course-header-image { max-width: none; width: 100%; }
        }
        .page-list { list-style: none; margin-left: 0; }
        .page-list li {
            margin-bottom: 1rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .page-list a { text-decoration: none; font-weight: 500; }
        .page-list a:hover { text-decoration: underline; }
        .page-list .description { display: block; color: #666; font-size: 0.9rem; margin-top: 0.25rem; }
        .lang-toggle-global {
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1;
            white-space: nowrap;
            color: #888;
            text-align: right;
            margin: 0 0 0.8rem;
        }
        .lang-toggle-global button {
            background: none;
            border: none;
            padding: 0;
            color: #0066cc;
            cursor: pointer;
            font: inherit;
            line-height: 1;
            vertical-align: middle;
        }
        .lang-toggle-global button.is-active {
            color: #333;
            font-weight: 600;
            cursor: default;
            pointer-events: none;
        }
        .i18n-block .lang-zh { display: none; }
        body.lang-zh .i18n-block .lang-en { display: none; }
        body.lang-zh .i18n-block .lang-zh { display: block; }
        body.lang-zh .i18n-block span.lang-zh { display: inline; }
    </style>
</head>
<body>
    <div class="wrap">
        <main>
            {{ content }}
        </main>
    </div>
    <script>
        (function () {
            var blocks = document.querySelectorAll(".i18n-block");
            if (!blocks.length) return;

            var main = document.querySelector("main");
            if (!main) return;

            var savedLang = localStorage.getItem("preferredLanguage");
            var initialLang = savedLang === "zh" ? "zh" : "en";
            document.body.classList.toggle("lang-zh", initialLang === "zh");

            var toggle = document.createElement("div");
            toggle.className = "lang-toggle-global";
            toggle.innerHTML = '<button type="button" data-lang="en">English</button> | <button type="button" data-lang="zh">中文</button>';
            main.insertBefore(toggle, main.firstChild);

            function setLang(lang) {
                var isZh = lang === "zh";
                document.body.classList.toggle("lang-zh", isZh);
                localStorage.setItem("preferredLanguage", isZh ? "zh" : "en");
                toggle.querySelectorAll("button").forEach(function (b) {
                    b.classList.toggle("is-active", b.getAttribute("data-lang") === (isZh ? "zh" : "en"));
                });
            }

            setLang(initialLang);
            toggle.addEventListener("click", function (e) {
                var btn = e.target.closest("button");
                if (!btn) return;
                setLang(btn.getAttribute("data-lang"));
            });
        })();
    </script>
</body>
</html>
