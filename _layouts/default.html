<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: white;
            font-size: 16px;
        }
        .wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem;
        }
        nav {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.9rem;
        }
        nav a { color: #0066cc; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        main h1 { font-size: 1.8rem; font-weight: 400; margin: 0 0 0.75rem; }
        main h2 { font-size: 1.3rem; font-weight: 500; margin: 2rem 0 0.75rem; }
        main h3 { font-size: 1.1rem; font-weight: 500; margin: 1.5rem 0 0.5rem; }
        main p { margin-bottom: 1rem; }
        main ul, main ol { margin: 0 0 1rem 1.4rem; }
        main li { margin-bottom: 0.35rem; }
        main a { color: #0066cc; }
        main strong { font-weight: 600; }
        main em { font-style: italic; }
        main hr { border: none; border-top: 1px solid #e0e0e0; margin: 2rem 0; }
        main table { width: 100%; border-collapse: collapse; margin: 0 0 1.5rem; font-size: 0.88rem; }
        main th, main td { text-align: left; padding: 0.5rem 0.65rem; border-bottom: 1px solid #e6e6e6; vertical-align: top; }
        main th { font-weight: 600; background: #f5f5f5; border-bottom: 2px solid #ddd; }
        main table.schedule { border-collapse: separate; border-spacing: 0; }
        main table.schedule tbody + tbody tr:first-child td { border-top: 2px solid #c5c9ce; }
        main table.schedule tbody.block-b { background: #f3f5f7; }
        main table.schedule tbody.due { background: #fff6e5; }
        main table.schedule tbody.due tr:first-child td { border-top: 2px solid #e6d3a5; }
        main table.schedule td.week {
            white-space: nowrap;
            font-weight: 600;
            color: #444;
            vertical-align: middle;
            text-align: center;
            width: 3.2em;
        }
        main table.schedule td.topic { vertical-align: middle; }
        main table.schedule td.date,
        main table.schedule th:nth-child(3) {
            white-space: nowrap;
            min-width: 7em;
        }
        main table.schedule ul.readings {
            margin: 0;
            padding-left: 1.15em;
        }
        main table.schedule ul.readings li {
            margin: 0 0 0.25rem;
        }
        main table.schedule ul.readings li:last-child { margin-bottom: 0; }
        main table.schedule ul.readings li:only-child {
            list-style: none;
            margin-left: -1.15em;
        }
        main table.schedule ul.readings li.optional { color: #666; }
        @media (max-width: 768px) {
            .wrap { padding: 1rem 1rem 3rem; }
            main h1 { font-size: 1.5rem; }
            main table { display: block; overflow-x: auto; }
        }
        .page-list { list-style: none; margin-left: 0; }
        .page-list li {
            margin-bottom: 1rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .page-list a { text-decoration: none; font-weight: 500; }
        .page-list a:hover { text-decoration: underline; }
        .page-list .description { display: block; color: #666; font-size: 0.9rem; margin-top: 0.25rem; }
        .lang-toggle {
            font-size: 0.8rem;
            font-weight: 400;
            margin-left: 0.6rem;
            white-space: nowrap;
            color: #888;
        }
        .lang-toggle button {
            background: none;
            border: none;
            padding: 0;
            color: #0066cc;
            cursor: pointer;
            font: inherit;
        }
        .lang-toggle button.is-active {
            color: #333;
            font-weight: 600;
            cursor: default;
            pointer-events: none;
        }
        .i18n-block .lang-zh { display: none; }
        .i18n-block.is-zh .lang-en { display: none; }
        .i18n-block.is-zh .lang-zh { display: block; }
    </style>
</head>
<body>
    <div class="wrap">
        <nav>
            <a href="{{ '/' | relative_url }}">Teaching</a>
            {% if page.url != '/' %}
            <span style="color:#999;"> / </span>
            <span>{{ page.title }}</span>
            {% endif %}
        </nav>
        <main>
            {{ content }}
        </main>
    </div>
    <script>
        document.querySelectorAll(".i18n-block").forEach(function (block) {
            var heading = block.querySelector("h2");
            if (!heading) return;
            var toggle = document.createElement("span");
            toggle.className = "lang-toggle";
            toggle.innerHTML = '<button type="button" data-lang="en" class="is-active">English</button> | <button type="button" data-lang="zh">中文</button>';
            heading.appendChild(toggle);
            toggle.addEventListener("click", function (e) {
                var btn = e.target.closest("button");
                if (!btn) return;
                var lang = btn.getAttribute("data-lang");
                block.classList.toggle("is-zh", lang === "zh");
                toggle.querySelectorAll("button").forEach(function (b) {
                    b.classList.toggle("is-active", b === btn);
                });
            });
        });
    </script>
</body>
</html>
