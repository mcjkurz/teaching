function fillList(id, items, maxAbs) {
  const ul = document.getElementById(id);
  for (const f of items) {
    const li = document.createElement("li");
    const w = document.createElement("span");
    w.className = "word";
    w.textContent = f.word;
    const track = document.createElement("span");
    track.className = "bar-track";
    const bar = document.createElement("span");
    bar.className = "bar";
    bar.style.width = (Math.abs(f.z) / maxAbs * 100).toFixed(1) + "%";
    track.appendChild(bar);
    const v = document.createElement("span");
    v.className = "val";
    v.textContent = f.z.toFixed(2);
    li.append(w, track, v);
    ul.appendChild(li);
  }
}

const allZ = [...DATA.earlyPositive, ...DATA.earlyNegative,

             .map(f => Math.abs(f.z));
const maxAbs = Math.max(...allZ);

fillList("early-neg", DATA.earlyNegative, maxAbs);
fillList("late-pos", DATA.latePositive, maxAbs);
fillList("late-neg", DATA.lateNegative, maxAbs);

function trace(idx, color, name) {
  const pts = DATA.chapters.slice(idx[0], idx[1]);
  return {
    type: "scatter3d", mode: "markers", name: name,
    x: pts.map(p => p.x), y: pts.map(p => p.y), z: pts.map(p => p.z),
    text: pts.map(p => "第" + p.n + "回"),
    marker: { color: color, size: 5, opacity: 0.85 },
    hovertemplate: "%{text}<extra>" + name + "</extra>"
  };
}
