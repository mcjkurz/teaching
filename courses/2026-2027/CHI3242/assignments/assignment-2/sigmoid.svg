<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="The logistic (sigmoid) function: an S-shaped curve mapping any score z to a probability between 0 and 1">
  <rect width="640" height="400" fill="#ffffff"/>
  <!-- axes -->
  <line x1="60" y1="32" x2="60" y2="340" stroke="#9aa1ad" stroke-width="2"/>
  <line x1="60" y1="340" x2="600" y2="340" stroke="#9aa1ad" stroke-width="2"/>
  <!-- x ticks -->
  <g fill="#6a7386" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">
    <line x1="150" y1="340" x2="150" y2="347" stroke="#9aa1ad" stroke-width="2"/><text x="150" y="366">-4</text>
    <line x1="240" y1="340" x2="240" y2="347" stroke="#9aa1ad" stroke-width="2"/><text x="240" y="366">-2</text>
    <line x1="330" y1="340" x2="330" y2="347" stroke="#9aa1ad" stroke-width="2"/><text x="330" y="366">0</text>
    <line x1="420" y1="340" x2="420" y2="347" stroke="#9aa1ad" stroke-width="2"/><text x="420" y="366">2</text>
    <line x1="510" y1="340" x2="510" y2="347" stroke="#9aa1ad" stroke-width="2"/><text x="510" y="366">4</text>
  </g>
  <text x="330" y="392" text-anchor="middle" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2333">線性輸出 z · linear score z</text>
  <!-- y ticks -->
  <g fill="#6a7386" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="15" text-anchor="end">
    <text x="50" y="345">0</text>
    <text x="50" y="195">0.5</text>
    <text x="50" y="45">1</text>
  </g>
  <text x="50" y="16" text-anchor="end" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2333">p</text>
  <!-- 0.5 guide line -->
  <line x1="60" y1="190" x2="600" y2="190" stroke="#e3e6ec" stroke-width="2" stroke-dasharray="7 7"/>
  <!-- sigmoid curve -->
  <polyline fill="none" stroke="#1f5fd6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
    points="60,337 75,336 90,334 105,331 120,326 135,318 150,306 165,289 180,266 195,238 210,207 225,177 240,152 255,132 270,118 285,109 300,103 315,99 330,97 345,95 360,94 375,93 390,92 405,91 420,90 435,89 450,88 465,87 480,86 495,85 510,84 525,83 540,82 555,81 570,80 585,79 600,78"/>
  <text x="150" y="120" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f5fd6">σ(z) = 1 / (1 + e⁻ᶻ)</text>
</svg>